<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Apfelbaum · Cockpit</title>
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0b0e14; --ink:#f3f4f7; --ink-2:#b9bfcc; --ink-3:#7f8696; --line:rgba(255,255,255,.12);
  --good:#46d38a; --bad:#ff6b5e; --gold:#ffcf5a; --acc:#6aa8ff; --brand:#ef5a5f;
  --glass:rgba(255,255,255,.07); --glass-2:rgba(255,255,255,.12);
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:dark}
body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#18233f 0%,var(--bg) 60%);background-attachment:fixed;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 70px;display:grid;gap:14px}
a{color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.01em}
.logo i{width:12px;height:12px;border-radius:3px;background:var(--brand);transform:rotate(45deg);display:block}
.links{display:flex;gap:8px;flex-wrap:wrap}
.link,.btn{display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:10px;text-decoration:none;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.link:hover,.btn:hover{border-color:rgba(255,255,255,.35)}
.btn.primary{background:var(--ink);color:#0b0e14;border-color:var(--ink);font-weight:600}
.btn.big{padding:14px;font-size:16px;border-radius:12px;width:100%}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:inherit;font-size:13px;padding:7px 14px;border:1px solid var(--line);background:var(--glass);color:var(--ink-2);border-radius:999px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tab[aria-selected="true"],.tab[aria-pressed="true"]{color:#0b0e14;background:var(--ink);border-color:var(--ink);font-weight:600}
.stage{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.03) inset;background:#0a0f1f}
canvas{display:block;width:100%;touch-action:manipulation}
.tip{position:absolute;pointer-events:none;background:rgba(10,14,24,.9);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:12.5px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transform:translate(-50%,-110%);white-space:nowrap;z-index:3;opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.tip b{display:block;font-size:14px;margin-bottom:1px}
.tip .num{font-family:var(--mono)}
.hud{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;flex-wrap:wrap}
.pill{background:var(--glass-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:14px 16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.kpi span{display:block;color:var(--ink-3);font-size:12px}
.kpi b{display:block;font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.kpi small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}
.kpi.g b{color:var(--good)} .kpi.r b{color:var(--bad)} .kpi.y b{color:var(--gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-3);font-size:12.5px}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
.msg{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink-2)}
.login{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);padding:16px;z-index:10}
.login form{width:100%;max-width:360px;background:#141a26;border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:14px}
.f{display:grid;gap:5px;font-size:12.5px;color:var(--ink-2)}
.f input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#0b0e14;color:var(--ink)}
.err{color:var(--bad);font-size:13px}
@media (prefers-reduced-motion:reduce){.tip{transition:none}}
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <form id="login-form" autocomplete="on">
    <div class="logo"><i></i>Apfelbaum</div>
    <div class="f" style="color:var(--ink-3)">Gleiche Anmeldung wie im Cockpit.</div>
    <label class="f">E-Mail<input id="login-email" type="email" autocomplete="username" required></label>
    <label class="f">Passwort<input id="login-pass" type="password" autocomplete="current-password" required></label>
    <div class="err" id="login-err" role="alert" hidden></div>
    <button type="submit" class="btn primary big" id="login-btn">Anmelden</button>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="logo"><i></i>Apfelbaum <span style="font-size:13px;font-weight:500;color:var(--ink-3)" id="stand"></span></div>
    <nav class="links"><a class="link" href="bot.html">Bot-Cockpit</a><a class="link" href="index.html">◆ Cockpit</a></nav>
  </header>
  <div class="bar">
    <div class="tabs" role="tablist" id="range"></div>
    <div class="tabs"><button type="button" class="tab" id="b-replay">↻ Alles von vorn</button><button type="button" class="tab" id="b-harvest">🪜 Ernte erneut</button><button type="button" class="tab" id="b-legs" aria-pressed="false">🏷 Beine</button></div>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" role="img" aria-label="Apfelbaum: Jedes Bein des Bots ist ein Ast, jeder Trade ein Apfel. Ein Männchen pflückt die reifen Äpfel."></canvas>
    <div class="hud"><span class="pill" id="hud-l"></span><span class="pill" id="hud-r"></span></div>
    <div class="tip" id="tip"></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="legend"><span><i style="background:#d8352e"></i>reifer Apfel = Gewinn (größer = mehr R)</span><span><i style="background:#8a6a3a"></i>fauler Apfel = Verlust</span><span><i style="background:#9fb07a"></i>verschrumpelt = Break-even</span><span><i style="background:#2f8f46"></i>jeder Ast = ein Bein</span></div>
  <div class="msg" id="msg">Wird geladen …</div>
</div>

<script>
(function(){
  // ---------- Grundlagen (wie die anderen Cockpit-Seiten) ----------
  const SUPABASE_URL = "https://qqsxtzbukkneptegkbkf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_pOBjg9lbOcJwV-4qz9ilAw_YZwADBCT"; // öffentlich gedacht, Schutz über Login + RLS
  const SESSION_KEY = "cockpit_session", SEEN_KEY = "baum_zuletzt_gesehen";
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const fmt = (v, d = 0) => v == null || isNaN(v) ? "–" : (+v).toLocaleString("de-DE", {minimumFractionDigits: d, maximumFractionDigits: d});
  function loadSession(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){ return null; } }
  function saveSession(s){ try{ s ? localStorage.setItem(SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSION_KEY); }catch(e){} }
  async function authRequest(grant, body){
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=${grant}`, {method:"POST", headers:{apikey:SUPABASE_KEY, "Content-Type":"application/json"}, body:JSON.stringify(body)});
    const d = await res.json().catch(() => ({}));
    if(!res.ok) throw Object.assign(new Error(d.error_description || d.msg || d.message || ("HTTP " + res.status)), {status:res.status});
    const s = {access_token:d.access_token, refresh_token:d.refresh_token, expires_at:d.expires_at || Math.floor(Date.now()/1000) + (d.expires_in || 3600), email:d.user && d.user.email};
    saveSession(s); return s;
  }
  async function validSession(){
    const s = loadSession();
    if(!s || !s.refresh_token) return null;
    if(s.expires_at - 60 > Date.now()/1000) return s;
    try{ return await authRequest("refresh_token", {refresh_token:s.refresh_token}); }
    catch(e){ if(e.status >= 400 && e.status < 500) saveSession(null); return null; }
  }
  async function sb(path){
    const s = await validSession();
    if(!s){ showLogin(); throw new Error("nicht angemeldet"); }
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {headers:{apikey:SUPABASE_KEY, Authorization:"Bearer " + s.access_token}});
    if(res.status === 401){ saveSession(null); showLogin(); throw new Error("Sitzung abgelaufen"); }
    if(!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }
  function showLogin(){ $("#app").hidden = true; $("#login").hidden = false; }
  $("#login-form").addEventListener("submit", async e => {
    e.preventDefault(); const err = $("#login-err"); err.hidden = true; $("#login-btn").disabled = true;
    try{ await authRequest("password", {email:$("#login-email").value.trim(), password:$("#login-pass").value}); $("#login").hidden = true; start(); }
    catch(x){ err.textContent = x.status === 400 ? "E-Mail oder Passwort stimmt nicht." : ("Anmeldung nicht möglich: " + x.message); err.hidden = false; }
    finally{ $("#login-btn").disabled = false; }
  });

  // ---------- Szene: Hilfen ----------
  const TAU = Math.PI * 2, calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const mix3 = (d, w, n, wd, ww, wn) => d.map((v, i) => v * wd + w[i] * ww + n[i] * wn);
  const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const PAL = {
    skyT: [[58, 146, 255], [52, 58, 120], [6, 10, 32]], skyB: [[196, 232, 255], [255, 168, 120], [24, 34, 78]],
    hillF: [[112, 168, 128], [86, 92, 116], [22, 42, 54]], hillN: [[70, 142, 84], [62, 82, 84], [14, 34, 38]], ground: [[88, 164, 72], [80, 112, 72], [20, 50, 34]]
  };
  const MONO = '"JetBrains Mono",ui-monospace,Menlo,monospace';

  const cv = $("#cv"), ctx = cv.getContext("2d"), stage = $("#stage"), tipEl = $("#tip");
  let W = 0, H = 0, K = 1, groundY = 0, treeX = 0, crateX = 0, cw = 0, ch = 0, rotL = 0, rotR = 0, beL = 0, beR = 0;
  let DATA = null, rangeDays = 0, fruits = [], hangs = [], tips = [], tipsByLeg = [], legEnd = [], root = null, ends = [], floaters = [], sparks = [], petals = [], leaves = [], clouds = [], stars = [], fireflies = [], grass = [];
  let blossoms = [], legCount = 13, legs = [], showLegs = false, wobble = 0, stats = {}, simT = 0, hourOverride = null, instant = false, forcePose = null, pointer = null;
  const view = {};

  // ---------- Baum: Stamm -> 3 Gabeln -> 1 Ast je Bein -> Zweige -> dichte Krone ----------
  function build(n){
    const r = rng(11); legCount = Math.max(3, n); legEnd = [];
    const groups = [0, 0, 0]; for(let i = 0; i < legCount; i++) groups[i % 3]++;
    root = {d: 0, len: 100, wid: 28, ang: 0, kids: [], ph: 0, leg: -1};
    let li = 0;
    groups.forEach((m, gi) => {
      const fork = {d: 1, len: 70, wid: 15, ang: (gi - 1) * .6 + (r() - .5) * .1, kids: [], ph: r() * TAU, leg: -1}; root.kids.push(fork);
      for(let i = 0; i < m; i++){
        const leg = li++, rel = (m === 1 ? 0 : (i / (m - 1) - .5)) * 1.5 + (r() - .5) * .1;
        const br = {d: 2, len: 98 + r() * 24, wid: 8.5, ang: rel, kids: [], ph: r() * TAU, leg, isLeg: true, hue: r() * 14 - 7,
          leaves: Array.from({length: 5}, () => lf(r, 30))};
        fork.kids.push(br); twig(br, 3, br.len, br.wid, leg, r);
      }
    });
  }
  const lf = (r, s) => ({dx: (r() - .5) * s * 1.6, dy: (r() - .5) * s - 4, rx: 8 + r() * 8, ry: 5 + r() * 5, rot: r() * TAU, l: r(), ph: r() * TAU});
  function twig(parent, d, len, wid, leg, r){
    for(let k = 0; k < 2; k++){
      const n = {d, len: len * (.6 + r() * .1), wid: Math.max(1.5, wid * .6), ang: (k ? 1 : -1) * (.3 + r() * .4) + (r() - .5) * .2, kids: [], ph: r() * TAU, leg};
      n.leaves = Array.from({length: d === 5 ? 9 : d === 4 ? 5 : 4}, () => lf(r, d === 5 ? 34 : 26));
      parent.kids.push(n);
      if(d < 5) twig(n, d + 1, n.len, n.wid, leg, r); else n.tip = true;
    }
  }
  function wind(t){ return calm ? .1 : Math.sin(t * .35) * .55 + Math.sin(t * .93 + 1.3) * .3 + Math.sin(t * 2.1) * .1; }
  function drawNode(n, x, y, pa, t, w){
    const a = pa + n.ang + (w * .024 + Math.sin(t * 1.1 + n.ph) * .01 * (calm ? .2 : 1)) * (.4 + n.d * .35);
    const L = n.len * K, x2 = x + Math.sin(a) * L, y2 = y - Math.cos(a) * L, mx = (x + x2) / 2 + Math.cos(a) * L * .06, my = (y + y2) / 2 + Math.sin(a) * L * .06;
    ctx.lineWidth = Math.max(1.2, n.wid * K); ctx.strokeStyle = `rgb(${88 - n.d * 5},${60 - n.d * 4},${40 - n.d * 3})`;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(mx, my, x2, y2); ctx.stroke();
    if(n.d <= 2){ ctx.lineWidth = Math.max(1, n.wid * K * .3); ctx.strokeStyle = "rgba(255,225,175,.11)"; ctx.beginPath(); ctx.moveTo(x - n.wid * K * .2, y); ctx.quadraticCurveTo(mx - n.wid * K * .2, my, x2 - n.wid * K * .2, y2); ctx.stroke(); }
    if(n.leaves) ends.push([n, x2, y2]);
    if(n.isLeg) legEnd[n.leg] = {x: x2, y: y2};
    if(n.tip){ const tp = {x: x2, y: y2, leg: n.leg}; tips.push(tp); if(n.leg >= 0) (tipsByLeg[n.leg] = tipsByLeg[n.leg] || []).push(tp); }
    for(const k of n.kids) drawNode(k, x2, y2, a, t, w);
  }

  // ---------- Layout ----------
  function resize(){
    W = stage.parentElement.clientWidth;
    H = W < 640 ? clamp(Math.min(innerHeight * .74, W * 1.5), 440, 760) : clamp(Math.min(W * .6, innerHeight * .82), 460, 760);
    const dpr = Math.min(devicePixelRatio || 1, 2); cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + "px"; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    K = Math.min(H / 600, W / 640); groundY = H * .84; treeX = W * (W < 640 ? .40 : .43); crateX = W * (W < 640 ? .83 : .84);
    cw = Math.min(150 * K, W * .3); ch = 54 * K; rotL = W * .04; rotR = Math.max(rotL + 40, treeX - 80 * K); beL = treeX + 110 * K; beR = Math.max(beL + 20, crateX - cw / 2 - 16 * K);
    const r = rng(5);
    clouds = Array.from({length: 6}, () => ({x: r() * W, y: H * (.06 + r() * .26), s: (.6 + r() * .8) * K, v: 3 + r() * 6}));
    stars = Array.from({length: 150}, () => ({x: r() * W, y: r() * groundY * .8, a: .5 + r() * .5, p: r() * TAU, s: 1 + r() * 1.6}));
    fireflies = Array.from({length: 26}, () => ({x: r() * W, y: groundY - r() * H * .4, p: r() * TAU, v: .3 + r() * .5}));
    grass = Array.from({length: Math.round(W / 4)}, () => ({x: r() * W, h: (7 + r() * 16) * K, p: r() * TAU, c: r()}));
    leaves = Array.from({length: 12}, () => ({x: r() * W, y: r() * groundY, p: r() * TAU, v: 14 + r() * 18, rot: r() * TAU}));
    petals = Array.from({length: 16}, () => ({x: r() * W, y: r() * groundY, p: r() * TAU, v: 10 + r() * 12, rot: r() * TAU}));
    layoutFruits();
  }

  // ---------- Daten -> Früchte ----------
  const bday = ts => (Date.now() - new Date(ts).getTime()) / 864e5;
  const rOf = t => t.risiko > 0 ? t.gv / t.risiko : (t.gv > 0 ? 1 : -1);
  const kindOf = t => Math.abs(rOf(t)) < .1 ? "be" : t.gv > 0 ? "win" : "loss";
  const legOf = t => (t.kommentar || "").split("|")[0];
  const legIdx = c => { if(!c) return -1; const i = legs.findIndex(l => l.startsWith(c) || c.startsWith(l)); return i; };
  const shortLeg = l => { const [s, tf, st] = l.split(":"); return `${s} ${tf} ${(st || "").replace(/_/g, " ")}`; };
  function mkFruit(t, i, animate, delay){
    const k = kindOf(t), R = rOf(t);
    return {t, k, R, sz: k === "be" ? 7 : 9 + Math.min(Math.abs(R), 3) * (k === "win" ? 2.3 : 1.8), leg: legIdx(legOf(t)), slot: 0, state: animate ? "wait" : "rest", delay, p: 0, dur: 1.1 + Math.random() * .5, fx: 0, fy: 0, x: 0, y: 0, sq: 1, seed: (i * 7919) % 97 / 97};
  }
  function setup(mode){            // mode: "rest" (alles liegt), "replay" (alles fällt neu), "visit" (neue Trades hängen am Ast, Männchen pflückt)
    const all = DATA.trades.slice().filter(t => rangeDays === 0 || bday(t.geschlossen) <= rangeDays).sort((a, b) => new Date(a.geschlossen) - new Date(b.geschlossen));
    stats = {n: all.length, win: 0, loss: 0, be: 0, ernte: 0, faul: 0, best: -9, bestT: null};
    for(const t of all){ const k = kindOf(t); stats[k]++; if(k === "win") stats.ernte += t.gv; if(k === "loss") stats.faul += t.gv; if(rOf(t) > stats.best){ stats.best = rOf(t); stats.bestT = t; } }
    let pend = [];
    if(mode === "visit"){
      const q = new URLSearchParams(location.search); let seen = null; try{ seen = localStorage.getItem(SEEN_KEY); }catch(e){}
      if(q.get("harvest")) pend = all.slice(-(+q.get("harvest")));
      else if(seen) pend = all.filter(t => new Date(t.geschlossen) > new Date(seen)).slice(-8);
    }
    const rest = all.filter(t => !pend.includes(t)), pick = a => a.slice(-30);
    const show = [...pick(rest.filter(t => kindOf(t) === "win")), ...pick(rest.filter(t => kindOf(t) === "loss")), ...rest.filter(t => kindOf(t) === "be").slice(-12)].sort((a, b) => new Date(a.geschlossen) - new Date(b.geschlossen));
    const step = Math.min(.17, 3 / Math.max(1, show.length));
    fruits = show.map((t, i) => mkFruit(t, i, mode === "replay", i * step + .4));
    renumberSlots(); layoutFruits();
    const st = DATA.status || {}, base = (st.kontostand || 10000) * .01;
    hangs = [];
    for(const p of (DATA.positions || [])) hangs.push({open: true, pos: p, leg: legIdx(p.bein), ripe: clamp(.5 + .5 * Math.tanh((p.gv || 0) / base), 0, 1), sz: 12});
    for(const t of pend) hangs.push({pend: true, t, k: kindOf(t), R: rOf(t), leg: legIdx(legOf(t)), ripe: kindOf(t) === "win" ? 1 : 0, sz: 11 + Math.min(Math.abs(rOf(t)), 3) * 1.2});
    hangs.forEach((h, i) => h.si = i);
    man.tasks = hangs.filter(h => h.pend).map(h => ({h})); man.cur = null; man.ladder = null; man.carry = null; if(man.st !== "sit") man.st = "return";
    blossoms = Array.from({length: 150}, (_, i) => i).sort((a, b) => ((a * 37) % 101) - ((b * 37) % 101)).slice(0, 56);
    const nOpen = hangs.filter(h => h.open).length, nPend = hangs.filter(h => h.pend).length;
    $("#hud-l").textContent = nPend ? (nPend === 1 ? "1 neuer Apfel seit deinem letzten Besuch" : `${nPend} neue Äpfel seit deinem letzten Besuch`) : nOpen ? `${nOpen} offene Trades am Baum` : "Nichts offen · der Baum blüht";

      if(window.__DEV_PAYLOAD){ window.__tick = (dt, n) => { for(let i = 0; i < n; i++) tick(dt); return man.st; }; window.__man = man; }
      requestAnimationFrame(frame);
    }catch(e){ if(e.message !== "nicht angemeldet") $("#msg").textContent = "Daten konnten nicht geladen werden (" + e.message + ")."; console.error(e); }
  }
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if(DATA) resize(); }, 120); });
  (async function init(){ if(window.__DEV_PAYLOAD){ start(); return; } (await validSession()) ? start() : showLogin(); })();
})();
</script>
